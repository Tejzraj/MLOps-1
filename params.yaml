phase2_api:
  bundle_path: artifacts/phase2/mohler-b0-inference-v1-20261109T095935Z-d812a332/bundle
  bundle_environment_variable: INTERVIEW_MODEL_BUNDLE
  manifest_filename: bundle_manifest.json
  expected_manifest_sha256: 036f6ac95e47d096d55839f4afe76751af7b7164e8b02b39f1acb8a8a2f85c99
  expected_model_version: '1.0.0'
  expected_configuration: B0
  host: 127.0.0.1
  port: 8000
  workers: 1
  log_level: info
  output_root: artifacts/phase2
  documentation_path: docs/phase2/fastapi_backend.md
  public_limitations:
    - Question text is accepted but is not a predictive feature.
    - A reference answer is required; output is a quality category, not a numerical grade or detailed feedback.
    - Trained on narrow-domain Mohler short answers; generalization to other interview domains is unverified.
    - Minority-class recall is weak and probabilities are not established as calibrated.
    - Published test results use a previously inspected benchmark, not an independent unseen test.
  example_request:
    question: What is a stack?
    reference_answer: A stack is a last in first out data structure.
    candidate_answer: A stack is a last in first out data structure.
  verification_startup_timeout_seconds: 30
  verification_poll_seconds: 0.1
  client_timeout_seconds: 10

phase2_gx:
  output_root: artifacts/phase2
  documentation_path: docs/phase2/gx_data_validation.md
  expected_gx_version: '1.24.1'
  inputs:
    train:
      path: '../MLOps/data/processed/train.parquet'
      sha256: f8918ad16e914f231c979144282e02e3326b83207b75b038d1ec9a7d6db6a894
    validation:
      path: '../MLOps/data/processed/val.parquet'
      sha256: 011d6d74002069cfedaabbf579adb9f48bfc27dab261f939d81bb029f436c047
    test:
      path: '../MLOps/data/processed/test.parquet'
      sha256: 91baa727c27d2c7d28424425222689c86c957003aa85b2164cb932718b156386
  required_columns: [question_id, question, reference_answer, candidate_answer, quality_label]
  required_types:
    question_id: [str]
    question: [str]
    reference_answer: [str]
    candidate_answer: [str]
    quality_label: [int64]
  non_null_columns: [question_id, question, reference_answer, candidate_answer, quality_label]
  nonblank_columns: [question_id, question, reference_answer, candidate_answer]
  nonblank_regex: '\S'
  minimum_rows: 1
  optional_row_id_columns: [answer_id, row_id, id]
  scores:
    score_grader1: {types: [float64], minimum: 0.0, maximum: 5.0}
    score_grader2: {types: [float64], minimum: 0.0, maximum: 5.0}
    score_avg: {types: [float32], minimum: 0.0, maximum: 5.0}
  duplicate_content_diagnostic: true
  result_format:
    result_format: SUMMARY
    partial_unexpected_count: 0
    include_unexpected_rows: false
    return_unexpected_index_query: false
  tests: [tests/test_gx_validation.py, tests/test_gx_group_leakage.py, tests/test_split.py]
  unit_test_sample_rows: 16
  progress_bars: false
  text_validation_view: object_preserve_values

